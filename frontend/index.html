<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WorldPulse</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #e6edf3;
    }
    header {
      background: #111827;
      padding: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .card {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
    }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌍 WorldPulse</h1>
    <p>Observatório global em tempo quase real</p>
  </header>

  <div class="grid" id="grid"></div>

  <script src="app.js"></script>
</body>
</html>
